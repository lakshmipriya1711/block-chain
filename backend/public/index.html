<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Verifier API</title><style>body{margin:0;background:#f7f5ed;color:#413a57;font:16px system-ui;padding:40px}main{max-width:760px;margin:auto}h1{font-size:34px}.panel{background:#fff;padding:22px;border-radius:16px;margin:18px 0;box-shadow:0 8px 24px #413a5714}code{background:#f0effa;padding:3px 7px;border-radius:5px}.ok{color:#19805d;font-weight:700}li{margin:10px 0}</style></head><body><main><p class="ok">● API ONLINE</p><h1>Academic Verifier backend</h1><div class="panel"><strong>Server status</strong><p id="status">Checking database connection...</p></div><div class="panel"><strong>Available endpoints</strong><ul><li><code>POST /api/auth/signup</code> Create an account</li><li><code>POST /api/auth/login</code> Sign in</li><li><code>GET /api/auth/me</code> Read the signed-in user</li><li><code>GET /api/credentials/:id</code> Verify a credential</li></ul></div></main><script>fetch('/api/health').then(r=>r.json()).then(d=>document.querySelector('#status').textContent=`${d.service} is healthy. Database: ${d.database}.`)</script></body></html>
